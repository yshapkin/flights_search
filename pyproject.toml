[project]
name = "FlightsSearch"
version = "0.1.0"
description = "Flight search experiments"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "G", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["typing", "collections.abc"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]
